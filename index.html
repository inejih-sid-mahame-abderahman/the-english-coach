<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="إرشاد شخصي في اللغة الإنجليزية مصمَّم حول مستواك وأهدافك ونقاط ضعفك وتقدّمك.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:site_name" content="ذا إنجلش كوتش">
<meta property="og:title" content="ذا إنجلش كوتش | إرشاد شخصي في اللغة الإنجليزية">
<meta property="og:description" content="إرشاد شخصي في اللغة الإنجليزية مصمَّم حول مستواك وأهدافك ونقاط ضعفك وتقدّمك.">
<meta property="og:image" content="OG_IMAGE_HERE">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F7F7F3; --bg-2:#EEEEE8; --surface:#FFFFFF;
  --ink:#16181D; --ink-2:#444952; --ink-3:#6B707A;
  --line:#DDDDD4; --line-strong:#B9B9AE;
  --accent:#2043D9; --accent-ink:#FFFFFF; --accent-soft:#E7ECFC; --accent-line:#BFCBF5;
  --r:16px;
  --header-h:72px;
  --sec:clamp(64px,9vw,120px);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --bg-2:#161A1E; --surface:#1A1E23;
    --ink:#F2F1EC; --ink-2:#B9BCC3; --ink-3:#8A8F98;
    --line:#292E35; --line-strong:#444A53;
    --accent:#809BFF; --accent-ink:#101215; --accent-soft:#1B2442; --accent-line:#33427A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --bg-2:#161A1E; --surface:#1A1E23;
  --ink:#F2F1EC; --ink-2:#B9BCC3; --ink-3:#8A8F98;
  --line:#292E35; --line-strong:#444A53;
  --accent:#809BFF; --accent-ink:#101215; --accent-soft:#1B2442; --accent-line:#33427A;
  color-scheme:dark;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.125rem;line-height:1.8;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:0}
body.menu-open{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.35;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
#main{outline:none;overflow-x:clip}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:clamp(20px,4vw,40px)}
.skip{position:absolute;inset-inline-start:12px;top:-70px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;transition:top .2s}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.h1{font-size:clamp(2.1rem,4.4vw,3.6rem);line-height:1.3}
.h2{font-size:clamp(1.8rem,3.5vw,2.7rem);line-height:1.35}
.lead{font-size:clamp(1.1rem,1.5vw,1.25rem);color:var(--ink-2);max-width:58ch;line-height:1.85}
.eyebrow{font-size:.95rem;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:.8em}
.eyebrow::before{content:"";width:28px;height:1.5px;background:currentColor}

.sec{padding-block:var(--sec)}
.sec--alt{background:var(--bg-2)}
section[id]{scroll-margin-top:calc(var(--header-h) + 8px)}

/* placeholder token (kept in Latin so it is easy to find & replace) */
.ph{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono);font-size:.78em;line-height:1.5;background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent-line);padding:.2em .55em;border-radius:6px;word-break:break-all;font-weight:400}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.7em 1.6em;border-radius:999px;font-weight:600;font-size:1rem;line-height:1.4;text-align:center;border:1.5px solid transparent;transition:background-color .2s,color .2s,border-color .2s,transform .2s;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn--secondary{border-color:var(--ink);color:var(--ink);background:transparent}
.btn--secondary:hover{background:var(--ink);color:var(--bg)}
.btn--light{background:var(--bg);color:var(--ink)}
.btn--light:hover{background:color-mix(in srgb,var(--bg) 88%,var(--ink))}
.btn--ghost-light{border-color:color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg)}
.btn--ghost-light:hover{background:var(--bg);color:var(--ink)}
.btn--block{width:100%}
.btn--sm{min-height:46px;padding:.5em 1.25em;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* ============ HEADER ============ */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid transparent;transition:border-color .25s}
.header.scrolled{border-bottom-color:var(--line)}
.header__in{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:24px}
.brand{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.2rem;white-space:nowrap}
.brand__mark{width:12px;height:12px;background:var(--accent);border-radius:50% 50% 0 50%;transform:rotate(8deg)}
.nav{display:flex;align-items:center;gap:26px;margin-inline-start:auto}
.nav ul{display:flex;gap:24px}
.nav ul a{position:relative;font-size:.98rem;font-weight:500;color:var(--ink-2);padding:8px 0;transition:color .2s}
.nav ul a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .25s}
.nav ul a:hover,.nav ul a[aria-current="page"]{color:var(--ink)}
.nav ul a:hover::after,.nav ul a[aria-current="page"]::after{transform:scaleX(1)}
.burger{display:none;position:relative;z-index:2;width:44px;height:44px;border:0;background:transparent;border-radius:10px;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:0}
.burger span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(4px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){transform:translateY(-4px) rotate(-45deg)}

@media (max-width:1100px){
  .burger{display:flex}
  .nav{position:fixed;inset:0;z-index:1;margin:0;flex-direction:column;align-items:stretch;justify-content:space-between;gap:24px;background:var(--bg);
    padding:calc(var(--header-h) + env(safe-area-inset-top,0px) + 12px) 24px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility .25s}
  .menu-open .nav{opacity:1;visibility:visible;transform:none}
  .nav ul{flex-direction:column;gap:0}
  .nav ul a{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:600;color:var(--ink);padding:14px 0;border-bottom:1px solid var(--line)}
  .nav ul a::after{display:none}
  .nav ul a[aria-current="page"]{color:var(--accent)}
  .nav__cta .btn{width:100%}
}

/* sticky mobile cta */
.sticky-cta{display:none}
@media (max-width:1100px){
  .sticky-cta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--bg) 95%,transparent);border-top:1px solid var(--line);transform:translateY(110%);visibility:hidden;transition:transform .3s,visibility .3s}
  .sticky-cta.show{transform:none;visibility:visible}
  .menu-open .sticky-cta{visibility:hidden}
  .sticky-cta .btn{width:100%}
  .footer{padding-bottom:100px}
}

/* ============ HERO ============ */
.hero{padding-top:clamp(28px,5vw,80px)}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,6vw,88px);align-items:center}
.hero__copy .eyebrow{margin-bottom:24px}
.hero h1 .mute{color:var(--ink-3)}
.hero .lead{margin:26px 0 34px}
.trust{display:flex;flex-wrap:wrap;gap:10px 32px;margin-top:clamp(40px,6vw,80px);padding-block:26px;border-top:1px solid var(--line);color:var(--ink-2);font-size:1rem;font-weight:500}
.trust li{display:flex;align-items:center;gap:10px}
.trust li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media (max-width:900px){.hero__grid{grid-template-columns:1fr}.hero__media{order:2}}

/* image slots */
.portrait{position:relative;width:100%;max-width:470px;margin-inline:auto}
.portrait::before{content:"";position:absolute;top:16px;right:16px;bottom:-14px;left:-14px;border:1.5px solid var(--accent);border-radius:calc(var(--r) + 8px);opacity:.55;z-index:0}
.slot{position:relative;z-index:1;aspect-ratio:4/5;border-radius:calc(var(--r) + 8px);overflow:hidden;background:var(--bg-2);border:1px solid var(--line)}
.slot__img{width:100%;height:100%;object-fit:cover}
.slot__ph{display:grid;place-content:center;justify-items:center;gap:12px;height:100%;padding:24px;text-align:center;
  background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--ink) 4%,transparent) 14px 15px)}
.slot__ph small{font-size:.9rem;color:var(--ink-3);max-width:26ch;line-height:1.6}
.portrait--lg{max-width:520px}

/* ============ SPLIT (editorial) ============ */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px)}
.split__head{position:sticky;top:calc(var(--header-h) + 32px + env(safe-area-inset-top,0px));align-self:start}
.split__head .lead{margin-top:20px}
@media (max-width:900px){.split{grid-template-columns:1fr}.split__head{position:static}}

.problem-list{border-top:1px solid var(--line-strong)}
.problem-list li{padding:18px 0;border-bottom:1px solid var(--line);font-size:clamp(1.12rem,1.6vw,1.3rem);line-height:1.6;font-family:var(--font-display);font-weight:500}
.problem-list-intro{font-size:1rem;color:var(--ink-3);margin-bottom:12px}
.solution{margin-top:clamp(36px,5vw,60px);padding:clamp(24px,3.5vw,40px);border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:var(--r);border-start-start-radius:0;border-end-start-radius:0}
.solution h3{font-size:clamp(1.4rem,2.4vw,1.9rem)}
.solution p{margin-top:10px;color:var(--ink-2);max-width:52ch}

/* ============ HOW IT WORKS ============ */
.sec-head{max-width:780px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head .lead{margin-top:18px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.step{position:relative;padding-top:24px;border-top:1px solid var(--line-strong)}
.step::before{content:"";position:absolute;top:-1px;inset-inline-start:0;width:44px;height:3px;background:var(--accent)}
.step__n{font-family:var(--font-display);font-weight:600;font-size:clamp(2.6rem,4vw,3.4rem);line-height:1.1;color:var(--accent);margin-bottom:14px}
.step h3{font-size:1.3rem;margin-bottom:8px}
.step p{color:var(--ink-2);font-size:1.02rem}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}

/* ============ MENTORSHIP CARDS ============ */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:stretch}
@media (max-width:1040px){.cards{grid-template-columns:1fr;max-width:640px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,2.6vw,34px);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:0 14px 34px -18px color-mix(in srgb,var(--ink) 30%,transparent)}
.card__level{font-size:.95rem;font-weight:600;color:var(--accent);margin-bottom:8px}
.card h3{font-size:1.65rem}
.card__sub{font-family:var(--font-display);font-weight:500;font-size:1.15rem;color:var(--ink-2);margin-top:6px}
.card__desc{color:var(--ink-2);margin-top:14px;font-size:1.02rem}
.ticks{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:10px;flex:1;align-content:start}
.ticks li{position:relative;padding-inline-start:28px;font-size:1.02rem;line-height:1.6}
.ticks li::before{content:"";position:absolute;inset-inline-start:2px;top:.78em;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.card__foot{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.price{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.price__v{font-family:var(--font-display);font-weight:600;font-size:1.7rem;line-height:1.4}
.price small{font-size:.92rem;color:var(--ink-3)}

/* ============ TRANSFORMATION ============ */
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.ba{grid-template-columns:1fr}}
.ba__col{border-radius:var(--r);padding:clamp(24px,3.4vw,44px)}
.ba__col h3{font-size:1.2rem;font-weight:600;margin-bottom:20px}
.ba__col li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid;font-size:1.1rem}
.ba__col li::before{flex:none}
.ba__before{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.ba__before li{border-color:var(--line)}
.ba__before li::before{content:"–";color:var(--ink-3)}
.ba__after{background:var(--accent);color:var(--accent-ink)}
.ba__after li{border-color:color-mix(in srgb,var(--accent-ink) 28%,transparent);font-weight:500}
.ba__after li::before{content:"";width:10px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-2px);align-self:center}
.fine{margin-top:22px;font-size:.95rem;color:var(--ink-3);max-width:62ch}

/* ============ PLAN TIMELINE ============ */
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tl__i{position:relative;padding:40px 0 0 18px}
.tl__i::before{content:"";position:absolute;top:0;inset-inline-start:0;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl__i::after{content:"";position:absolute;top:6.5px;inset-inline-start:24px;inset-inline-end:8px;height:1px;background:var(--line-strong)}
.tl__i:last-child::after{display:none}
.tl__i h3{font-size:1.3rem;margin-bottom:6px}
.tl__i p{font-size:1rem;color:var(--ink-2);line-height:1.65}
.tl__i .tl__n{font-size:.9rem;font-weight:600;color:var(--ink-3);margin-bottom:4px;line-height:1.4}
@media (max-width:900px){
  .tl{grid-template-columns:1fr}
  .tl__i{padding:0 40px 30px 0}
  .tl__i::before{top:6px}
  .tl__i::after{top:28px;inset-inline-start:6.5px;inset-inline-end:auto;width:1px;height:calc(100% - 20px)}
  .tl__i{padding:0 0 30px 0;padding-inline-start:40px}
}
.plan-note{margin-top:clamp(28px,4vw,48px);padding:22px 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:62ch;color:var(--ink-2)}

/* ============ ABOUT ============ */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,7vw,110px);align-items:start}
@media (max-width:900px){.about{grid-template-columns:1fr}}
.bio{margin-top:30px;border-top:1px solid var(--line-strong)}
.bio__item{padding:20px 0;border-bottom:1px solid var(--line)}
.bio__item h3{font-size:1.15rem;margin-bottom:6px}
.bio__item p{color:var(--ink-2)}
.about .actions{margin-top:30px}

/* ============ TESTIMONIALS ============ */
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:1040px){.quotes{grid-template-columns:1fr;max-width:640px}}
.quote{display:flex;flex-direction:column;justify-content:space-between;gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,2.6vw,34px)}
.quote blockquote{margin:0;font-family:var(--font-display);font-size:1.25rem;font-weight:500;line-height:1.7}
.quote__by{display:flex;align-items:center;gap:14px;padding-top:20px;border-top:1px solid var(--line)}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--bg-2);border:1px dashed var(--line-strong)}
.avatar img{width:100%;height:100%;object-fit:cover}
.quote__by .name{font-weight:600;font-size:1rem;line-height:1.5}
.quote__by .imgph{display:block;margin-top:4px;font-size:.66rem}

/* ============ FAQ ============ */
.faq{border-top:1px solid var(--line-strong)}
.faq__item{border-bottom:1px solid var(--line)}
.faq__q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;background:none;border:0;text-align:start;font-family:var(--font-display);font-weight:600;font-size:clamp(1.1rem,1.6vw,1.25rem);line-height:1.6}
.faq__q:hover{color:var(--accent)}
.faq__pm{position:relative;flex:none;width:18px;height:18px}
.faq__pm::before,.faq__pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:currentColor;transition:transform .3s}
.faq__pm::after{transform:rotate(90deg)}
.faq__item.open .faq__pm::after{transform:rotate(0)}
.faq__a{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility .3s}
.faq__item.open .faq__a{grid-template-rows:1fr;visibility:visible}
.faq__a>div{overflow:hidden}
.faq__a p{padding:0 0 22px;padding-inline-end:40px;color:var(--ink-2);max-width:60ch}

/* ============ FINAL CTA ============ */
.final{background:var(--ink);color:var(--bg);border-radius:calc(var(--r) + 10px);padding:clamp(36px,7vw,88px)}
.final h2{font-size:clamp(1.9rem,4vw,3.2rem);line-height:1.4;max-width:22ch}
.final p{margin:22px 0 32px;font-size:1.2rem;color:color-mix(in srgb,var(--bg) 78%,transparent);max-width:46ch}
.final-wrap{padding-bottom:var(--sec)}

/* ============ FOOTER ============ */
.footer{border-top:1px solid var(--line);padding-block:clamp(48px,6vw,80px) 36px}
.footer__grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:40px}
@media (max-width:760px){.footer__grid{grid-template-columns:1fr;gap:32px}}
.footer p.desc{margin-top:14px;color:var(--ink-2);max-width:34ch}
.footer h4{font-family:var(--font-display);font-size:1rem;margin:0 0 14px;font-weight:600}
.footer li{margin-bottom:8px}
.footer li a{color:var(--ink-2);transition:color .2s}
.footer li a:hover{color:var(--accent)}
.soc__pending{display:flex;flex-direction:column;gap:4px;align-items:flex-start;color:var(--ink-2)}
.soc__pending .ph{font-size:.7rem}

function Btn({ label, href = "#/", variant = "primary", form = false, block = false, size = "" }) {
  const cls = `btn btn--${variant}${block ? " btn--block" : ""}${size ? " btn--" + size : ""}`;
  if (form) {
    const ready = formReady();
    return `<a class="${cls}" href="${esc(CONFIG.formUrl)}" data-form${ready ? ' target="_blank" rel="noopener noreferrer"' : ""}>${esc(label)}</a>`;
  }
  return `<a class="${cls}" href="${esc(href)}">${esc(label)}</a>`;
}

function Navbar() {
  return `<div class="wrap header__in">
    <a class="brand" href="#/" aria-label="${esc(CONFIG.brand)}، الرئيسية"><span class="brand__mark" aria-hidden="true"></span><span>${esc(CONFIG.brand)}</span></a>
    <nav class="nav" id="site-nav" aria-label="القائمة الرئيسية">
      <ul>${NAV.map(([l, r]) => `<li><a href="#${r}" data-route="${r}">${l}</a></li>`).join("")}</ul>
      <div class="nav__cta">${Btn({ label: "ابدأ رحلتك مع الإنجليزية", form: true, size: "sm" })}</div>
    </nav>
    <button class="burger" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="فتح القائمة"><span></span><span></span></button>
  </div>`;
}

function ImgSlot(key, alt, hint, eager) {
  const v = CONFIG.images[key];
  if (!isPh(v)) return `<img class="slot__img" src="${esc(v)}" alt="${esc(alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async">`;
  return `<div class="slot__ph" role="img" aria-label="${esc(alt)} (مكان مخصّص للصورة)"><span class="ph">${esc(v)}</span><small>${esc(hint || "")}</small></div>`;
}
const Portrait = (large) => `<figure class="portrait${large ? " portrait--lg" : ""}"><div class="slot">${ImgSlot("coach", "صورة المدرّب", "استبدلها بصورة شخصية احترافية بنسبة 4:5", !large)}</div></figure>`;

  </article>`;
}

/* ============ ROUTER ============ */
const SECTION_ROUTES = { "/mentorships": "mentorships", "/how-it-works": "how-it-works", "/about": "about", "/testimonials": "testimonials", "/faq": "faq" };
let currentView = null;

function parseRoute() {
  let h = location.hash.slice(1);
  if (!h) return "/";
  if (h[0] !== "/") h = "/" + h;
  h = h.replace(/\/+$/, "");
  return h || "/";
}

function setMeta(prog) {
  const title = prog ? `${PROGRAMS[prog].name} | ${CONFIG.brand}` : `${CONFIG.brand} | إرشاد شخصي في اللغة الإنجليزية`;
  const desc = prog ? PROGRAMS[prog].tagline : "إرشاد شخصي في اللغة الإنجليزية مصمَّم حول مستواك وأهدافك ونقاط ضعفك وتقدّمك.";
  document.title = title;
  const d = $('meta[name="description"]'); if (d) d.setAttribute("content", desc);
  const ot = $('meta[property="og:title"]'); if (ot) ot.setAttribute("content", title);
  const od = $('meta[property="og:description"]'); if (od) od.setAttribute("content", desc);
}

function scrollToSection(id, smooth) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: smooth && !reduced() ? "smooth" : "auto", block: "start" });
}

let io = null;
function observeReveal() {
  const els = document.querySelectorAll("#main .reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  if (!io) io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });
  els.forEach(e => io.observe(e));
}

function updateNavState(path, view) {
  document.querySelectorAll("#site-nav a[data-route]").forEach(a => {
    const r = a.getAttribute("data-route");
    const active = (view.startsWith("detail") && r === "/mentorships") || (!view.startsWith("detail") && r === path);
    if (active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function route() {
  const path = parseRoute();
  const m = path.match(/^\/mentorship\/(basic|medium|advanced)$/);
  const prog = m ? m[1] : null;
  const section = SECTION_ROUTES[path] || null;
  const view = prog ? "detail:" + prog : "home";
  const main = $("#main");

  if (currentView !== view) {
    main.innerHTML = prog ? DetailView(PROGRAMS[prog]) : HomeView();
    main.classList.remove("page-in"); void main.offsetWidth; main.classList.add("page-in");
    setMeta(prog);
    currentView = view;
    if (!section) window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
    observeReveal();
    if (section) scrollToSection(section, false);
  } else if (section) {
    scrollToSection(section, true);
  } else {
    window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
  }
  updateNavState(path, view);
  closeMenu();
}

/* ============ MENU / STICKY / DIALOG ============ */
function closeMenu(returnFocus) {
  const b = $(".burger"); if (!b) return;
  document.body.classList.remove("menu-open");
  b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-label", "فتح القائمة");
  if (returnFocus) b.focus();
}
function toggleMenu() {
  const b = $(".burger");
  const open = !document.body.classList.contains("menu-open");
  document.body.classList.toggle("menu-open", open);
  b.setAttribute("aria-expanded", String(open)); b.setAttribute("aria-label", open ? "إغلاق القائمة" : "فتح القائمة");
}
function openNotice() {
  const d = $("#notice");
  if (d && typeof d.showModal === "function") d.showModal();
  else alert("رابط نموذج التقديم لم يُضَف بعد.");
}

document.addEventListener("click", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;

  const skip = t.closest("[data-skip]");
  if (skip) { e.preventDefault(); $("#main").focus(); return; }

  const formLink = t.closest("a[data-form]");
  if (formLink) { if (!formReady()) { e.preventDefault(); closeMenu(); openNotice(); } return; }

  if (t.closest(".burger")) { toggleMenu(); return; }

  if (t.closest("[data-close]")) { $("#notice").close(); return; }

  const q = t.closest(".faq__q");
  if (q) {
    const item = q.closest(".faq__item");
    const open = !item.classList.contains("open");
    item.classList.toggle("open", open);
    q.setAttribute("aria-expanded", String(open));
    return;
  }

  const a = t.closest('a[href^="#/"]');
  if (a && a.getAttribute("href").slice(1) === parseRoute()) { e.preventDefault(); route(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("menu-open")) closeMenu(true);
});
$("#notice").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  $("#site-header").classList.toggle("scrolled", y > 8);
  $("#sticky-cta").classList.toggle("show", y > 520);
}, { passive: true });

/* ============ INIT ============ */
$("#site-header").innerHTML = Navbar();
$("#site-footer").innerHTML = Footer();
$("#sticky-cta").innerHTML = Btn({ label: "ابدأ الإرشاد", form: true });
route();
</script>
